name: Node.js CI

on:
  push:
    branches:
      - main
    tags:
      - "releases/**"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      node-version: 22.x

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node v${{ env.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Fetch next version
        uses: mathieudutour/github-tag-action@v6.1
        id: find_version
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: main
          dry_run: true

      - name: Set package.json version to ${{ steps.find_version.outputs.new_tag }}
        run: >
          node -e "const fs=require('fs');
          const packageJson=JSON.parse(fs.readFileSync('package.json', 'utf8'));
          packageJson.version='${{ steps.find_version.outputs.new_version }}';
          fs.writeFileSync('package.json', JSON.stringify(packageJson, null, 2) + '\n');"

      - run: pnpm run lint

      - run: pnpm run types

      - run: pnpm run zip

      - run: pnpm run zip:firefox

      - uses: actions/upload-artifact@v4
        with:
          name: extension-zips
          path: .output/*.zip

  package:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: extension-zips
          path: .output/

      - name: Bump version and push tag
        uses: mathieudutour/github-tag-action@v6.1
        id: tag_version
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: main

      - name: Create GitHub release tag ${{ steps.tag_version.outputs.new_tag }}
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}
          artifacts: .output/*.zip

  upload:
    needs: package
    runs-on: ubuntu-latest
    env:
      node-version: 22.x
      FIREFOX_EXTENSION_ID: "{f7fe2556-f3c9-4167-a98e-671faacf82cf}"

    strategy:
      fail-fast: false
      matrix:
        command:
          - stores
          - sentry

    steps:
      - name: Checkout
        if: matrix.command == 'stores'
        uses: actions/checkout@v4

      - name: Setup pnpm
        if: matrix.command == 'stores'
        uses: pnpm/action-setup@v4

      - name: Setup Node v${{ env.node-version }}
        if: matrix.command == 'stores'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.node-version }}
          cache: pnpm

      - name: Install dependencies
        if: matrix.command == 'stores'
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        if: matrix.command == 'stores'
        with:
          name: extension-zips
          path: .output/

      - name: Submit to browser stores
        if: matrix.command == 'stores'
        run: >
          pnpm run submit -- --chrome-zip "$(ls .output/*-chrome.zip)"
          --chrome-extension-id "${{ secrets.CHROME_EXTENSION_ID }}"
          --chrome-client-id "${{ secrets.CHROME_CLIENT_ID }}"
          --chrome-client-secret "${{ secrets.CHROME_CLIENT_SECRET }}"
          --chrome-refresh-token "${{ secrets.CHROME_REFRESH_TOKEN }}"
          --firefox-zip "$(ls .output/*-firefox.zip)"
          --firefox-sources-zip "$(ls .output/*-sources.zip)"
          --firefox-extension-id "${{ env.FIREFOX_EXTENSION_ID }}"
          --firefox-jwt-issuer "${{ secrets.WEB_EXT_API_KEY }}"
          --firefox-jwt-secret "${{ secrets.WEB_EXT_API_SECRET }}"

      - name: Sentry Release
        if: matrix.command == 'sentry' && needs.package.outputs.new_tag
        uses: getsentry/action-release@v1.3.0
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          environment: production
          version: ${{ needs.package.outputs.new_tag }}
          ignore_missing: true
          set_commits: skip
